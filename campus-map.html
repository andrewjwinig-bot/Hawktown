<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hawktown — campus map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
  html, body { margin:0; height:100%; background:#F5EFE4; font-family:'Archivo', 'Helvetica Neue', Helvetica, sans-serif; }
  #map { position:absolute; inset:0; background:#F5EFE4; }
  .leaflet-tile-pane { filter: grayscale(0.55) sepia(0.14) contrast(1.06) brightness(1.02); }
  .leaflet-container { background:#F5EFE4; font-family:inherit; }
  .leaflet-control-attribution { font-size:9px; background:rgba(251,248,243,0.85); }
  .price-pin {
    background:#FBF8F3; border:1.5px solid #4A2F1B; border-radius:20px;
    padding:4px 9px; font-size:12px; font-weight:800; color:#22180F;
    white-space:nowrap; box-shadow:0 2px 6px rgba(74,47,27,0.28); text-align:center;
  }
  .price-pin.leased { background:#EFEAE3; color:#8A7F74; border-color:#B7AA9C; }
  .price-pin.est { border-style:dashed; }
  .price-pin:hover { background:#22180F; color:#FBF8F3; border-color:#22180F; }
  .price-dot {
    width:13px; height:13px; border-radius:50%; background:#B3151B; border:2.5px solid #FBF8F3;
    box-shadow:0 1px 3px rgba(34,24,15,0.45);
  }
  .price-dot.leased { background:#B0A79C; border-color:#F2EDE5; }
  .price-dot:hover { background:#22180F; transform:scale(1.25); }
  .leaflet-marker-icon:hover { z-index:9999 !important; }
  .poi-pin {
    background:rgba(74,47,27,0.88); color:#F3E9DA; border-radius:3px; padding:3px 8px;
    font-size:10px; font-weight:700; letter-spacing:0.10em; text-transform:uppercase; white-space:nowrap;
  }
  .poi-pin.food { background:#C0392B; }
  .leaflet-popup-content { margin:12px 14px; font-family:inherit; }
  .pop-addr { font-size:15px; font-weight:800; color:#22180F; letter-spacing:-0.01em; }
  .pop-meta { font-size:12px; color:#5E5045; margin-top:3px; }
  .pop-btn {
    display:block; width:100%; margin-top:10px; padding:8px 12px; border:none; border-radius:6px;
    background:#C08A2E; color:#22180F; font-family:inherit; font-size:13px; font-weight:800; cursor:pointer;
  }
  .pop-btn:hover { background:#A97722; }
  #status {
    position:absolute; left:10px; bottom:10px; z-index:500; background:rgba(251,248,243,0.94);
    border:1px solid #E6DCCD; border-radius:6px; padding:5px 9px; font-size:10px; font-weight:600; color:#7A6349;
  }
</style>
</head>
<body>
<div id="map"></div>
<script>
const CAMPUS = [40.60668, -75.37697]; // Linderman Library (verified via OSM)

// Fallback block-level coordinates per street, used until the address geocodes.
const STREET_FALLBACK = {
  "Pierce St":      [40.60851, -75.37027],
  "Birkel Ave":     [40.61017, -75.38204],
  "Montclair Ave":  [40.60887, -75.38287],
  "Laufer St":      [40.60903, -75.37036],
  "Polk St":        [40.61021, -75.37306],
  "Fillmore St":    [40.61024, -75.37198],
  "Selfridge St":   [40.60620, -75.37025],
  "Hillside Ave":   [40.60704, -75.36994]
};

const POIS = [
  ["Lehigh", 40.60668, -75.37697, ""]
];

const map = L.map("map", { scrollWheelZoom: true, zoomControl: false }).setView([40.61000, -75.37000], 15);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: '© OpenStreetMap contributors'
}).addTo(map);

POIS.forEach(function (p) {
  L.marker([p[1], p[2]], {
    icon: L.divIcon({ className: "", html: '<div class="poi-pin ' + p[3] + '">' + p[0] + "</div>", iconSize: null }),
    interactive: false
  }).addTo(map);
});



const CACHE_KEY = "hawktown.geocode.v1";
let cache = {};
try { cache = JSON.parse(localStorage.getItem(CACHE_KEY) || "{}"); } catch (e) { cache = {}; }

let houses = [];
let markers = {};
const statusEl = { set textContent(v) {} };

function streetOf(addr) {
  const parts = addr.split(" ");
  return parts.slice(1).join(" ");
}

function coordsFor(h) {
  if (typeof h.lat === "number" && typeof h.lng === "number") return { ll: [h.lat, h.lng], exact: true };
  const hit = cache[h.addr];
  if (hit) return { ll: [hit[0], hit[1]], exact: true };
  const fb = STREET_FALLBACK[streetOf(h.addr)];
  return { ll: fb ? [fb[0], fb[1]] : CAMPUS, exact: false };
}

function walkMinutes(ll) {
  const R = 6371000, toRad = Math.PI / 180;
  const dLat = (CAMPUS[0] - ll[0]) * toRad;
  const dLng = (CAMPUS[1] - ll[1]) * toRad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(ll[0] * toRad) * Math.cos(CAMPUS[0] * toRad) * Math.sin(dLng / 2) ** 2;
  const m = 2 * R * Math.asin(Math.sqrt(a));
  return Math.max(2, Math.round((m * 1.25) / 78)); // 1.25 route factor, ~78 m/min
}

function spread(list) {
  const seen = {};
  return list.map(function (item) {
    const key = item.ll[0].toFixed(4) + "," + item.ll[1].toFixed(4);
    const n = seen[key] = (seen[key] || 0) + 1;
    if (n === 1) return item;
    const angle = (n - 1) * 2.399963; // golden-angle spiral
    const r = 0.000055 * Math.sqrt(n);
    return Object.assign({}, item, { ll: [item.ll[0] + r * Math.cos(angle), item.ll[1] + r * Math.sin(angle) * 1.3] });
  });
}

function iconFor(h, exact, zoom) {
  if (zoom < 17 && !focusMode) {
    return L.divIcon({
      className: "",
      html: '<div class="price-dot' + (h.status === "leased" ? " leased" : "") + '"></div>',
      iconSize: [14, 14], iconAnchor: [7, 7]
    });
  }
  const cls = "price-pin" + (h.status === "leased" ? " leased" : "") + (exact ? "" : " est");
  return L.divIcon({ className: "", html: '<div class="' + cls + '">$' + h.price + "</div>", iconSize: null, iconAnchor: [22, 12] });
}

function render() {
  Object.keys(markers).forEach(function (k) { map.removeLayer(markers[k]); });
  markers = {};
  const bounds = [];
  const zoom = map.getZoom();
  const placed = spread(houses.map(function (h) { const c = coordsFor(h); return { h: h, ll: c.ll, exact: c.exact }; }));
  placed.forEach(function (item) {
    const h = item.h, c = { ll: item.ll, exact: item.exact };
    bounds.push(c.ll);
    const m = L.marker(c.ll, {
      icon: iconFor(h, c.exact, zoom),
      riseOnHover: true,
      zIndexOffset: h.status === "leased" ? 0 : 100
    }).addTo(map);
    m.bindPopup(
      '<div class="pop-addr">' + h.addr + "</div>" +
      '<div class="pop-meta">' + h.beds + " bed · " + h.baths + " bath · $" + h.price + " per person</div>" +
      '<div class="pop-meta">' + (h.walk || walkMinutes(c.ll)) + " min walk to campus" + (c.exact ? "" : " (approx. block)") + "</div>" +
      '<button class="pop-btn" onclick="openHouse(' + h.i + ')">See the listing</button>'
    );
    markers[h.i] = m;
  });
  if (bounds.length && !didFit) {
    didFit = true;
    map.fitBounds(bounds.concat([CAMPUS]), { padding: focusMode ? [56, 56] : [40, 40], maxZoom: focusMode ? 17 : 16 });
  }
}

let didFit = false;
let focusMode = false;

map.on("zoomend", function () { if (houses.length) render(); });

window.openHouse = function (i) {
  parent.postMessage({ type: "hawktown:openHouse", index: i }, "*");
};

// Geocode uncached addresses one at a time (Nominatim asks for <=1 req/sec).
async function geocodeAll() {
  const todo = houses.filter(function (h) { return typeof h.lat !== "number" && !cache[h.addr]; });
  if (!todo.length) { statusEl.textContent = "Pins placed from verified street addresses"; return; }
  let done = 0;
  for (const h of todo) {
    statusEl.textContent = "Locating addresses… " + (done + 1) + "/" + todo.length;
    try {
      const url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&q=" +
        encodeURIComponent(h.addr + ", Bethlehem, PA 18015, USA");
      const res = await fetch(url, { headers: { "Accept": "application/json" } });
      const json = await res.json();
      if (json && json[0]) {
        cache[h.addr] = [parseFloat(json[0].lat), parseFloat(json[0].lon)];
        localStorage.setItem(CACHE_KEY, JSON.stringify(cache));
        render();
      }
    } catch (e) { /* keep the block-level fallback */ }
    done++;
    await new Promise(function (r) { setTimeout(r, 1100); });
  }
  const exact = houses.filter(function (h) { return cache[h.addr]; }).length;
  statusEl.textContent = exact + " of " + houses.length + " GPS-located · dashed pins are block-level";
}

let lastKey = "";
window.addEventListener("message", function (e) {
  const d = e.data;
  if (!d || d.type !== "hawktown:houses") return;
  const first = houses.length === 0;
  const key = (d.houses || []).map(function (h) { return h.i; }).join(",");
  if (d.focus) { focusMode = true; if (key !== lastKey) didFit = false; }
  lastKey = key;
  houses = d.houses || [];
  render();
  if (focusMode && houses.length === 1) markers[houses[0].i].openPopup();
  if (first) geocodeAll();
});

parent.postMessage({ type: "hawktown:mapReady" }, "*");
</script>
</body>
</html>
